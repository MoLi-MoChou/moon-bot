name: Desktop

# Moon Bot: builds the desktop app for Windows (NSIS installer + portable exe) and Linux
# (AppImage), runs the packaged-app check (mock model, one message end to end) on each,
# and on a v* tag publishes a GitHub pre-release with the update metadata the installed
# apps read: latest.yml + the installer's .blockmap (Windows) and latest-linux.yml
# (AppImage, block map embedded). Adapted from DS Bot's release.yml (Apache-2.0).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Check the tag matches app/package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # One root pnpm lockfile for the workspace: install at the root, run in the package.
      - run: pnpm install --frozen-lockfile
        working-directory: .
      # The app's unit tests run on Linux (as in DS Bot's test.yml); one file-lock test expects POSIX.
      - run: pnpm --filter moon-bot run build
      - run: pnpm run dist -- --win
      - name: Check the packaged app
        run: node scripts/check-packed.mjs
      - name: Size report (unpacked app, installer)
        run: |
          node scripts/size-report.mjs dist-pack/win-unpacked
          ls -l dist-pack/*.exe
      - name: Installed size (silent per-user install, then uninstall)
        shell: pwsh
        run: |
          $installer = Get-Item dist-pack/Moon-Bot-*-win-x64-setup.exe
          Start-Process -Wait -FilePath $installer.FullName -ArgumentList '/S'
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Moon Bot'
          $bytes = (Get-ChildItem -Recurse -File $dir | Measure-Object -Sum Length).Sum
          "installed on disk: {0:N1} MB in $dir" -f ($bytes / 1MB)
          Start-Process -Wait -FilePath (Join-Path $dir 'Uninstall Moon Bot.exe') -ArgumentList '/S'
      - uses: actions/upload-artifact@v4
        with:
          name: Moon-Bot-win-x64
          path: |
            app/dist-pack/Moon-Bot-*-win-x64-setup.exe
            app/dist-pack/Moon-Bot-*-win-x64-setup.exe.blockmap
            app/dist-pack/Moon-Bot-*-win-x64-portable.exe
            app/dist-pack/latest.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # One root pnpm lockfile for the workspace: install at the root, run in the package.
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm test
      - run: pnpm --filter moon-bot run build
      - run: pnpm run dist -- --linux AppImage
      - name: Check the packaged app
        run: xvfb-run -a node scripts/check-packed.mjs dist-pack/linux-unpacked/moon-bot
      - name: Size report (unpacked app, AppImage)
        run: |
          node scripts/size-report.mjs dist-pack/linux-unpacked
          ls -l dist-pack/*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: Moon-Bot-linux-x64
          path: |
            app/dist-pack/Moon-Bot-*-linux-x86_64.AppImage
            app/dist-pack/latest-linux.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Pre-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la out
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --prerelease --title "Moon Bot $TAG" \
            --notes "Moon Bot 桌面版预发布（未签名）。Windows：setup.exe 安装版（之后自动更新，不用重装）、portable.exe 便携版；Linux：AppImage（自动更新）。latest.yml / latest-linux.yml / .blockmap 是更新元数据。"
