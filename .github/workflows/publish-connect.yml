name: Publish connect

# The moon-bot-connect CLI on npm (docs/RELEASING.md). It is a separate package with its
# own version and its own tag: `connect-vX.Y.Z`. The job refuses a tag that does not match
# connect/package.json, verifies the exact tarball it is about to upload, and publishes
# with provenance so the registry can show where the artifact was built.
#
# Needs one repository secret: NPM_TOKEN, a granular token with read-and-write access to
# the moon-bot-connect package (or an automation token). Nothing here reads it into a file.
on:
  push:
    tags: ['connect-v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-connect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Check the tag matches connect/package.json
        if: startsWith(github.ref, 'refs/tags/connect-v')
        run: |
          expected="connect-v$(node -p "require('./connect/package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag $GITHUB_REF_NAME does not match $expected (bump connect/package.json first)"
            exit 1
          fi
      - name: Install
        run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 pnpm install --frozen-lockfile
      - name: Build and verify the tarball
        run: pnpm --filter moon-bot-connect run verify:package
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # A version that is already on the registry cannot be published again (and the
          # registry answers a first publish asynchronously: metadata first, the tarball a
          # few minutes later). Re-running a tag, or publishing by hand before tagging,
          # must stay a green no-op instead of a red job.
          version=$(node -p "require('./connect/package.json').version")
          if npm view "moon-bot-connect@$version" version >/dev/null 2>&1; then
            echo "::notice::moon-bot-connect@$version is already published; nothing to upload"
            exit 0
          fi
          pnpm --filter moon-bot-connect publish --access public --provenance
