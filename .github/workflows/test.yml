name: Test

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, node: 24 }
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
    defaults:
      run:
        shell: bash
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # pnpm version comes from root package.json packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # One root pnpm lockfile for the workspace: install at the root, run in the package.
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm test
      # Static checks at the repo root cover every workspace (core, contracts, ui,
      # desktop, connect): typecheck + lint via `pnpm run check:static`.
      - run: pnpm run check:static
        working-directory: .
      - run: pnpm run eval

  package:
    name: Connect package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # pnpm version comes from root package.json packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      # The tarball a publish would upload, installed and run: the checkout hides the
      # failure this catches (types under node_modules). No agent CLI exists here, which
      # is the case the doctor check has to survive.
      - run: pnpm --filter moon-bot-connect run verify:package

  scan:
    name: Leak scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Scan exactly the tracked files, as they would be published.
      - run: mkdir -p "$RUNNER_TEMP/tree" && git archive HEAD | tar -x -C "$RUNNER_TEMP/tree"
      - run: node scripts/scan.mjs "$RUNNER_TEMP/tree"
        env:
          SCAN_EXTRA_PATTERNS: ${{ secrets.SCAN_EXTRA_PATTERNS }}

  app:
    name: Desktop app profile
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # pnpm version comes from root package.json packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # One root pnpm lockfile: install at the root, run in the package. The test composes
      # the profile and starts no window, so it needs no Electron binary.
      - run: pnpm install --frozen-lockfile
        working-directory: .
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm test

  app-package:
    name: Desktop app package (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        # pnpm version comes from root package.json packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm --filter moon-bot run build
      - run: pnpm run dist
      - name: Check the packaged app
        run: node scripts/check-packed.mjs
      # The runner is a fresh machine, so the installer may run here. It must install for the
      # current user only, the installed app must pass the same check, and the uninstaller must
      # remove it again.
      - name: Install and check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Find-Entry($root) {
            Get-ChildItem "$root\Software\Microsoft\Windows\CurrentVersion\Uninstall" |
              Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -like 'Moon Bot*' }
          }
          $installer = Get-Item dist-pack/Moon-Bot-*-win-x64-setup.exe
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Moon Bot'
          $exe = Join-Path $dir 'Moon Bot.exe'
          if (-not (Test-Path $exe)) { throw "The installer did not put the app in $dir" }
          $entry = Find-Entry 'HKCU:'
          if (-not $entry) { throw 'No uninstall entry for the current user' }
          if (Find-Entry 'HKLM:') { throw 'The installer installed for all users' }
          node scripts/check-packed.mjs $exe
          if ($LASTEXITCODE -ne 0) { throw 'The installed app failed its check' }

      # The update builds the app a second time, so it runs only for changes to the app or the
      # workflows. A build of the next version is the feed; the installed app downloads it, checks
      # its sha512, and installs it as it quits.
      - name: Does the change touch the app?
        id: scope
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" | grep -qE '^(apps/desktop/|\.github/workflows/)'; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the next version
        if: steps.scope.outputs.update == 'true'
        run: |
          next="$(node -p "const [a, b, c] = require('./package.json').version.split(/[.-]/u); [a, b, Number(c) + 1].join('.')")"
          echo "NEXT_VERSION=$next" >> "$GITHUB_ENV"
          npx electron-builder --publish never -c.extraMetadata.version="$next" -c.directories.output=dist-next
      - name: Update the installed app and check it
        if: steps.scope.outputs.update == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Moon Bot\Moon Bot.exe'
          node scripts/check-update.mjs $exe dist-next
          if ($LASTEXITCODE -ne 0) { throw 'The installed app did not take the update' }
          # The installer goes on after the app has quit.
          function Installed-Version {
            Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' |
              ForEach-Object { Get-ItemProperty $_.PSPath } |
              Where-Object { $_.DisplayName -like 'Moon Bot*' } |
              Select-Object -ExpandProperty DisplayVersion
          }
          $deadline = (Get-Date).AddSeconds(240)
          while ((Installed-Version) -ne $env:NEXT_VERSION -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 3 }
          if ((Installed-Version) -ne $env:NEXT_VERSION) { throw "The installed version is $(Installed-Version), not $env:NEXT_VERSION" }
          while ((Get-Process | Where-Object { $_.Path -like '*deepseek-bot-updater*' }) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          node scripts/check-packed.mjs $exe
          if ($LASTEXITCODE -ne 0) { throw 'The updated app failed its check' }

      - name: Uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Find-Entry($root) {
            Get-ChildItem "$root\Software\Microsoft\Windows\CurrentVersion\Uninstall" |
              Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -like 'Moon Bot*' }
          }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Moon Bot'
          $exe = Join-Path $dir 'Moon Bot.exe'
          # The uninstaller removes the program only: the data location and the app's own data stay.
          $kept = foreach ($folder in (Join-Path $HOME '.moon-bot'), (Join-Path $env:APPDATA 'Moon Bot')) {
            New-Item -ItemType Directory -Force $folder | Out-Null
            $file = Join-Path $folder 'kept.txt'
            Set-Content $file 'kept'
            $file
          }
          $uninstaller = Join-Path $dir 'Uninstall Moon Bot.exe'
          Start-Process -FilePath $uninstaller -ArgumentList '/currentuser', '/S' -Wait
          # The uninstaller goes on from a copy in the temp folder, so wait for its result.
          $deadline = (Get-Date).AddSeconds(120)
          while (((Test-Path $exe) -or (Find-Entry 'HKCU:')) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (Test-Path $exe) { throw 'The uninstaller left the app in place' }
          if (Find-Entry 'HKCU:') { throw 'The uninstaller left its uninstall entry' }
          foreach ($file in $kept) { if (-not (Test-Path $file)) { throw "The uninstaller removed $file" } }

  docs:
    name: Doc links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-docs.mjs

  result:
    name: Test result
    needs: [test, scan, app, app-package, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success && test "${{ needs.scan.result }}" = success && test "${{ needs.app.result }}" = success && test "${{ needs.app-package.result }}" = success && test "${{ needs.docs.result }}" = success
