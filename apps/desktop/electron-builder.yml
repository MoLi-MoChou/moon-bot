appId: com.molimochou.moonbot
productName: Moon Bot
copyright: Copyright 2026 Fei2411, the DS Bot contributors and Moon Bot
artifactName: Moon-Bot-${version}-${os}-${arch}.${ext}
directories:
  output: dist-pack
files:
  - package.json
  # The main process ships bundled (dist-main/main.cjs); the child Host (service-host.ts),
  # preload.cjs and mica.css run from src/ as Node type-stripped sources.
  - dist-main/**
  - ui/dist/**
  - src/**
  - assets/**
  # Moon Bot: size. Source maps, type declarations and test folders do not run.
  - '!node_modules/@img/*linuxmusl*/**'
  - '!**/*.{map,d.ts,d.mts,d.cts,tsbuildinfo}'
  - '!**/node_modules/zod/src/**'
  - '!**/node_modules/*/{test,tests,__tests__}/**'
  - '!**/node_modules/@*/*/{test,tests,__tests__}/**'
# Chromium UI strings for the two languages the app has; the rest are 45 MB on Windows.
electronLanguages: [zh-CN, en-US]
# The installers and the AppImage, at the strongest compression.
compression: maximum
# The Host runs pnpm as a separate Node process to install plugins, so it must be a plain file.
asarUnpack:
  - node_modules/pnpm/**
# node-pty, sharp and koffi ship prebuilt binaries for each platform. A rebuild would compile
# node-pty from source and needs a C++ toolchain.
npmRebuild: false
# So the binaries come from npm as it installed them; a build for another architecture stops.
beforePack: ./scripts/before-pack.mjs
win:
  target:
    - target: nsis
      arch: [x64]
    # Moon Bot: a portable exe as in v0.1.0. It cannot update itself (no installer to run);
    # Settings > About points it at the release page instead.
    - target: portable
      arch: [x64]
  icon: assets/icon.ico
portable:
  artifactName: Moon-Bot-${version}-win-${arch}-portable.${ext}
nsis:
  # The installer the updater runs again, silently (/S), to update in place.
  artifactName: Moon-Bot-${version}-win-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  installerLanguages: [zh_CN, en_US]
  multiLanguageInstaller: true
linux:
  # The AppImage updates itself in place (electron-updater, latest-linux.yml); the deb does not.
  target:
    - target: AppImage
      arch: [x64]
  icon: assets/icon.png
  category: Utility
  executableName: moon-bot
mac:
  # A zip, not a dmg: macOS 26 calls a downloaded unsigned dmg damaged and will not open it (#351).
  target: zip
  # Ad-hoc signing seals the bundle; no Developer ID or notarization.
  identity: '-'
  hardenedRuntime: false
  icon: assets/icon.png
  category: public.app-category.productivity
# Where the installed app looks for updates (app-update.yml in the package). The build writes
# latest.yml beside the installer; the release workflow attaches both to the GitHub release,
# so the build itself never publishes (--publish never).
publish:
  provider: github
  owner: MoLi-MoChou
  repo: moon-bot
  releaseType: prerelease
