# Moon Bot web on a server: a published image, never built here.
#
#   cp .env.example .env      # MOON_BOT_PASSWORD and the model provider keys
#   ./update.sh               # pull + up -d + health check (auto rollback)
#   ./rollback.sh             # back to the tag update.sh replaced
#
# The tag comes from .env's MOON_BOT_TAG (update.sh rewrites it); `latest` follows `main`.
services:
  moon-bot:
    image: ${MOON_BOT_REGISTRY:-ghcr.io/zk020106/moon-bot}:${MOON_BOT_TAG:-latest}
    # A second instance on the same host (a test, a tenant) sets MOON_BOT_CONTAINER.
    container_name: ${MOON_BOT_CONTAINER:-moon-bot}
    restart: unless-stopped
    env_file: .env
    ports:
      - "${MOON_BOT_PORT:-8290}:8290"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8290/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # Docker's default seccomp profile blocks the user namespaces bubblewrap needs; DSH
    # then confines the Bots' commands with Landlock instead. No extra privileges.
